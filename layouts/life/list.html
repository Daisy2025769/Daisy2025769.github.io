<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ .Title }} - Daisy Space</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/quests.css"><link rel="stylesheet" href="/css/daisy-footer.css"></head><body><header class="chanel-header">
