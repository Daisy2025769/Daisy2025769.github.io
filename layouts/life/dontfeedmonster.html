<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DontFeedMonster - Daisy Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/ui-icons.css">
    <link rel="stylesheet" href="/css/dontfeedmonster.css">
</head>
<body>
    <header class="chanel-header">
        <div class="header-left">
            <a href="/" class="brand-logo"><img src="/logo.jpg" alt="Daisy home"></a>
        </div>
        <div class="header-center">
            <span class="page-title">My Creative Projects<img class="nav-illustration" src="/image/ui/coffee.png" alt=""></span>
        </div>
        <div class="header-right">
            <a href="/contact/" class="icon-btn" aria-label="Contact">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
            <a href="/" class="icon-btn" aria-label="Home">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>
        </div>
    </header>

    <main class="monster-main">
        <a class="monster-card" href="https://chromewebstore.google.com/detail/dontfeedmonster/fdnccdkmokepemgmaahebbegmebpjall?authuser=0&amp;hl=zh-CN" target="_blank" rel="noopener noreferrer" aria-label="Open DontFeedMonster in the Chrome Web Store">
            <section class="monster-copy">
                <h1><span>DontFeed</span><span>Monster</span></h1>
                <p>A playful productivity experiment that turns procrastination into something you can see. The more tasks you delay, the more you feed Momo, and the crazier the monster becomes.</p>
            </section>
            <section class="monster-gallery" aria-label="Momo character designs">
                <img class="momo momo-lv2" src="/image/dontfeedmonster/momo-lv2-cutout.png" alt="Momo level two">
                <img class="momo momo-lv1" src="/image/dontfeedmonster/momo-lv1-cutout.png" alt="Momo level one sleeping on a pizza cushion">
                <img class="momo momo-lv4" src="/image/dontfeedmonster/momo-lv4-cutout.png" alt="Momo at its craziest stage">
            </section>
        </a>
    </main>
</body>
</html>
