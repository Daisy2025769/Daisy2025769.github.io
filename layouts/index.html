<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daisy 的主页</title>
    
    <!-- 引入 Google 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- 全局设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            color: white;
            background-color: #000;
            overflow-x: hidden;
        }

        /* --- 背景大图区域 --- */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 1;
        }

        /* --- 顶部导航栏 --- */
        nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 30px 50px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

       /* 新的代码（针对图片的） */
.text-logo {
    margin-right: 60px; /* 保留和右边菜单的间距 */
    display: flex;      /* 让图片垂直居中更好看 */
    align-items: center;
    text-decoration: none;
}

/* 专门控制 Logo 图片的大小 */
.text-logo img {
    height: 60px; /* 设置高度，宽度会自动调整。你可以改这个数字来调大小 */
    width: auto;  /* 保证图片不变形 */
}

        .menu a {
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-right: 30px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .menu a:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }

        /* --- 中心内容 --- */
        .hero-content {
            z-index: 2;
            text-align: center;
            margin-top: 40px;
            padding: 0 20px;
        }

        .main-title {
            font-family: 'Georgia', serif; 
            font-style: italic;
            font-size: 56px; 
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            color: #eee;
            font-weight: 400;
            letter-spacing: 1.5px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 20px; }
            .text-logo { margin-right: 0; margin-bottom: 20px; }
            .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
            .menu a { margin-right: 0; font-size: 12px; }
            .main-title { font-size: 36px; }
            .subtitle { font-size: 14px; }
        }
    </style> 
</head>
<body>

    <div class="hero">
        <nav>
<a href="/" class="text-logo">
    <img src="/logo.jpg" alt="Daisy Space Logo">
</a>
            <div class="menu">
                <a href="/life/coffee/">Side Quest☕️</a>
                <a href="/business/">MAIN QUEST💼</a>
                <a href="/resume/">My Resume &#128196;</a>
                <a href="/contact/">Contact📮</a>
            </div>
        </nav>

        <div class="hero-content">
            <div class="main-title">Welcome to My Wonderland</div>
            <div class="subtitle">有一天人类会回到海洋，影像和文字会长存</div>
        </div>
    </div>

</body>
</html>
