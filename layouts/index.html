<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daisy 的主页</title>
    
    <!-- 引入 Google 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400&family=Merriweather:ital,wght@1,300&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/ui-icons.css">

    <style>
        /* --- 全局设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            color: #111;
            background-color: #fff;
            overflow-x: hidden;
        }

        /* --- 背景大图区域 --- */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            background-color: #fff;
            background-image: url('/image/home-cover-concept-v12.png');
            background-size: 106% auto;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 1;
        }

        /* --- 顶部导航栏 --- */
        nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            z-index: 10;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: clamp(18px, 3vw, 46px);
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .menu::-webkit-scrollbar { display: none; }

        .menu a {
            font-family: 'Courier Prime', 'Courier New', monospace;
            text-decoration: none;
            color: rgba(17, 17, 17, 0.86);
            font-size: clamp(14px, 1.25vw, 19px);
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .menu a:hover {
            color: #000;
            text-shadow: 0 0 8px rgba(0,0,0,0.16);
        }

        .menu .nav-illustration {
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
            mix-blend-mode: normal;
            width: 25px;
            height: 25px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 22px;
            flex: 0 0 auto;
        }

        .header-actions .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #111;
            text-decoration: none;
        }

        .header-actions .icon-svg {
            width: 29px;
            height: 29px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.65;
            transition: transform .2s ease;
        }

        .header-actions .icon-btn:hover .icon-svg {
            transform: translateY(-2px);
        }

        /* --- 中心内容 --- */
        .hero-content {
            z-index: 2;
            text-align: center;
            margin-top: 40px;
            padding: 0 20px;
        }

        .main-title {
            font-family: 'Merriweather', Georgia, serif;
            font-style: italic;
            font-size: 56px; 
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            color: #eee;
            font-weight: 400;
            letter-spacing: 1.5px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            nav { padding: 18px 16px; }
            .menu { gap: 20px; }
            .menu a { font-size: 13px; }
            .menu .nav-illustration { width: 21px; height: 21px; }
            .header-actions { gap: 14px; }
            .header-actions .icon-svg { width: 25px; height: 25px; }
            .main-title { font-size: 36px; }
            .subtitle { font-size: 14px; }
        }
    </style> 
</head>
<body>

    <div class="hero">
        <nav>
            <div class="menu">
                <a href="/life/coffee/">Side Quest<img class="nav-illustration" src="/image/ui/coffee.png" alt=""></a>
                <a href="/business/">Main Quest<img class="nav-illustration" src="/image/ui/macbook.png" alt=""></a>
                <a href="/resume/">My Resume<img class="nav-illustration" src="/image/ui/resume-girl.png" alt=""></a>
                <a href="/contact/">Contact<img class="nav-illustration" src="/image/ui/mailbox.png" alt=""></a>
            </div>
            <div class="header-actions" aria-label="Quick links">
                <a href="/contact/" class="icon-btn" aria-label="Contact">
                    <svg class="icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="/" class="icon-btn" aria-label="Home">
                    <svg class="icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
        </nav>

    </div>

</body>
</html>
