<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daisy 的主页</title>
    
    <!-- 引入 Google 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Courier+Prime:wght@400&family=Merriweather:ital,wght@1,300&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/ui-icons.css">

    <style>
        /* --- 全局设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            color: #111;
            background-color: #fff;
            overflow-x: hidden;
        }

        /* --- 背景大图区域 --- */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            background-color: #fff;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 1;
        }

        /* --- 顶部导航栏 --- */
        nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            z-index: 10;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: clamp(18px, 3vw, 46px);
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .menu::-webkit-scrollbar { display: none; }

        .menu a {
            font-family: 'Courier Prime', 'Courier New', monospace;
            text-decoration: none;
            color: rgba(17, 17, 17, 0.86);
            font-size: clamp(14px, 1.25vw, 19px);
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .menu a:hover {
            color: #000;
            text-shadow: 0 0 8px rgba(0,0,0,0.16);
            transform: translateY(-2px);
        }

        .menu .nav-illustration {
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
            mix-blend-mode: normal;
            width: 25px;
            height: 25px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 0 0 auto;
        }

        .header-actions .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #111;
            text-decoration: none;
            transition: transform .2s ease;
        }

        .header-actions .icon-svg {
            width: clamp(16px, 1.4vw, 22px);
            height: clamp(16px, 1.4vw, 22px);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.65;
        }

        .header-actions .icon-btn:hover {
            transform: translateY(-2px);
        }

        .magazine-cover {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            padding: 0 1.25vw 3.4vh;
            z-index: 2;
        }

        .cover-copy {
            width: 100%;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(17,17,17,.32);
            color: #130f0d;
            font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif;
            font-size: clamp(48px, 6.25vw, 112px);
            font-weight: 400;
            line-height: .94;
            letter-spacing: -.055em;
        }

        .cover-unit {
            transition: color .28s ease, opacity .28s ease, filter .28s ease;
        }

        .cover-link {
            color: inherit;
            text-decoration: none;
        }

        .cover-link .inline-photo {
            transition: transform .22s ease;
        }

        .main-focus:hover .inline-photo,
        .main-focus:focus-visible .inline-photo {
            transform: translateY(-.06em);
        }

        .side-focus {
            display: inline-flex;
            align-items: baseline;
            white-space: nowrap;
            vertical-align: baseline;
        }

        .collision-word,
        .collision-letter,
        .side-focus .inline-photo {
            display: inline-block;
            will-change: transform;
        }

        .side-focus .inline-photo {
            transform-origin: center;
        }

        .cover-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: .04em;
        }

        .hero.focus-side .cover-unit:not(.side-focus),
        .hero.focus-main .cover-unit:not(.main-focus) {
            color: #aaa;
            opacity: .34;
            filter: grayscale(1);
        }

        @media (prefers-reduced-motion: reduce) {
            .collision-letter,
            .side-focus .inline-photo {
                animation: none !important;
                transform: none !important;
                transition: none !important;
            }
        }

        .inline-photo {
            display: inline-block;
            width: 1.08em;
            height: .78em;
            margin: 0 .06em;
            object-fit: cover;
            vertical-align: -.05em;
        }

        .photo-yumeng {
            width: .82em;
            height: 1.05em;
            object-position: 57% center;
            vertical-align: -.17em;
        }

        .photo-qian {
            width: 1em;
            height: 1.02em;
            margin-left: .14em;
            margin-right: .04em;
            object-fit: contain;
            vertical-align: -.12em;
        }

        .photo-finance { width: 1.22em; object-position: center 38%; }
        .photo-write {
            width: 1.02em;
            height: .9em;
            object-fit: contain;
            vertical-align: -.1em;
        }
        .photo-design { width: 1.12em; object-fit: contain; }
        .photo-travel { width: .92em; height: .9em; }
        .photo-cook { width: 1.08em; }

        /* --- 中心内容 --- */
        .hero-content {
            z-index: 2;
            text-align: center;
            margin-top: 40px;
            padding: 0 20px;
        }

        .main-title {
            font-family: 'Merriweather', Georgia, serif;
            font-style: italic;
            font-size: 56px; 
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            color: #eee;
            font-weight: 400;
            letter-spacing: 1.5px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .hero {
                height: auto;
                min-height: 100svh;
                overflow: visible;
            }
            nav { padding: 18px 16px; }
            .menu { gap: 20px; }
            .menu a { font-size: 13px; }
            .menu .nav-illustration { width: 21px; height: 21px; }
            .header-actions { gap: 12px; }
            .header-actions .icon-svg { width: 16px; height: 16px; }
            .magazine-cover {
                position: relative;
                min-height: 100svh;
                padding: 110px 10px 24px;
            }
            .cover-copy {
                font-size: clamp(38px, 11vw, 62px);
                line-height: .96;
                letter-spacing: -.06em;
            }
            .main-title { font-size: 36px; }
            .subtitle { font-size: 14px; }
        }
    </style> 
</head>
<body>

    <div class="hero">
        <nav>
            <div class="menu">
                <a href="/life/coffee/" data-cover-focus="side">Side Quest<img class="nav-illustration" src="/image/ui/coffee.png" alt=""></a>
                <a href="/business/" data-cover-focus="main">Main Quest<img class="nav-illustration" src="/image/ui/macbook.png" alt=""></a>
                <a href="/resume/">My Resume<img class="nav-illustration" src="/image/ui/resume-girl.png" alt=""></a>
                <a href="/contact/">Contact<img class="nav-illustration" src="/image/ui/mailbox.png" alt=""></a>
            </div>
            <div class="header-actions" aria-label="Quick links">
                <a href="/contact/" class="icon-btn" aria-label="Contact">
                    <svg class="icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="/" class="icon-btn" aria-label="Home">
                    <svg class="icon-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
        </nav>

        <main class="magazine-cover" aria-label="About Yumeng">
            <div class="cover-copy">
                <span class="cover-unit">Hello, My Name is Yumeng<img class="inline-photo photo-yumeng" src="/image/home-cover/yumeng.jpg" alt="Yumeng">, My Family Name is Qian<img class="inline-photo photo-qian" src="/image/home-cover/qian.jpg" alt="Money bag illustration">, I Learnt </span><a class="cover-unit cover-link main-focus" href="/business/">Finance<img class="inline-photo photo-finance" src="/image/home-cover/finance.jpg" alt="Financial market display"></a><span class="cover-unit"> in SMU, I </span><a class="cover-unit cover-link side-focus" href="/life/film/" aria-label="Write"><span class="collision-word">Write</span><img class="inline-photo photo-write" src="/image/home-cover/write-v2.jpg" alt=""></a><span class="cover-unit">, </span><a class="cover-unit cover-link side-focus" href="/life/fashion/" aria-label="Design"><span class="collision-word">Design</span><img class="inline-photo photo-design" src="/image/home-cover/design.jpg" alt=""></a><span class="cover-unit">, I Explore during </span><a class="cover-unit cover-link side-focus" href="/life/wine/" aria-label="Travel"><span class="collision-word">Travel</span><img class="inline-photo photo-travel" src="/image/home-cover/travel.jpg" alt=""></a><span class="cover-unit">, and Sometimes I </span><a class="cover-unit cover-link side-focus" href="/life/coffee/" aria-label="Cook"><span class="collision-word">Cook</span><img class="inline-photo photo-cook" src="/image/home-cover/cook.jpg" alt=""></a>
            </div>
        </main>

    </div>

    <script>
        (() => {
            const hero = document.querySelector('.hero');
            const triggers = document.querySelectorAll('[data-cover-focus]');

            const activate = (mode) => {
                hero.classList.remove('focus-side', 'focus-main');
                if (mode) hero.classList.add(`focus-${mode}`);
            };

            triggers.forEach((trigger) => {
                const mode = trigger.dataset.coverFocus;
                trigger.addEventListener('mouseenter', () => activate(mode));
                trigger.addEventListener('mouseleave', () => activate(null));
                trigger.addEventListener('focus', () => activate(mode));
                trigger.addEventListener('blur', () => activate(null));
            });

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const collisionLinks = document.querySelectorAll('.side-focus');

            collisionLinks.forEach((link) => {
                const word = link.querySelector('.collision-word');
                const image = link.querySelector('.inline-photo');
                const letters = [...word.textContent];

                word.textContent = '';
                letters.forEach((character) => {
                    const letter = document.createElement('span');
                    letter.className = 'collision-letter';
                    letter.textContent = character;
                    letter.setAttribute('aria-hidden', 'true');
                    word.appendChild(letter);
                });

                const collide = () => {
                    if (reducedMotion) return;

                    word.querySelectorAll('.collision-letter').forEach((letter, index) => {
                        letter.animate([
                            { transform: 'translateX(0)' },
                            { transform: 'translateX(.13em)', offset: .38 },
                            { transform: 'translateX(-.035em)', offset: .68 },
                            { transform: 'translateX(0)' }
                        ], {
                            duration: 520,
                            delay: index * 28,
                            easing: 'cubic-bezier(.2,.9,.25,1.25)'
                        });
                    });

                    image.animate([
                        { transform: 'translate3d(0,0,0) rotate(0) scale(1)' },
                        { transform: 'translate3d(-.18em,0,0) rotate(-5deg) scale(1.1)', offset: .38 },
                        { transform: 'translate3d(.05em,0,0) rotate(2deg) scale(.98)', offset: .68 },
                        { transform: 'translate3d(0,0,0) rotate(0) scale(1)' }
                    ], {
                        duration: 620,
                        easing: 'cubic-bezier(.2,.9,.25,1.2)'
                    });
                };

                link.addEventListener('pointerenter', collide);
                link.addEventListener('focus', collide);
                link.addEventListener('pointermove', (event) => {
                    if (reducedMotion) return;
                    const rect = link.getBoundingClientRect();
                    const x = ((event.clientX - rect.left) / rect.width) - .5;
                    const y = ((event.clientY - rect.top) / rect.height) - .5;
                    image.style.transform = `translate3d(${x * 10}px, ${y * 7}px, 0) rotate(${x * 3}deg)`;
                });
                link.addEventListener('pointerleave', () => {
                    image.style.transform = '';
                });
                link.addEventListener('blur', () => {
                    image.style.transform = '';
                });
            });
        })();
    </script>

</body>
</html>
