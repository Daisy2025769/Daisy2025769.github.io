<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact - Daisy Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#161616;font-family:Montserrat,Arial,sans-serif}.contact-header{height:90px;padding:0 40px;display:flex;align-items:center;justify-content:space-between}.brand img{height:75px;width:auto;display:block}.home-icon{color:inherit;padding:12px}.home-icon svg{width:24px;height:24px}.contact-layout{max-width:1160px;margin:auto;min-height:calc(100vh - 150px);display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:90px;padding:45px 48px 80px}.mail-art{width:100%;height:auto;display:block}.contact-illustration{margin:0;align-self:center;position:sticky;top:130px}.contact-illustration h1{font:italic 64px Georgia,serif;text-align:center;margin:8px 0 0;padding-left:20%}.account-list{display:flex;flex-direction:column;align-items:center;gap:40px;margin:0;padding:0;list-style:none}.account-link{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;max-width:100%;padding:8px 20px;transition:transform .2s ease}.account-link:hover{transform:translateY(-5px)}.account-avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;object-position:50% 36%;box-shadow:0 8px 25px #00000012;margin-bottom:15px}.account-name{display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:500}.platform-icon{width:23px;height:23px;flex-shrink:0}.platform-label{font-size:11px;color:#777;margin-top:7px;letter-spacing:.7px}.account-link:focus-visible,.home-icon:focus-visible,.brand:focus-visible{outline:2px solid #333;outline-offset:6px;border-radius:10px}.contact-footer{text-align:center;padding:22px;font-size:10px;letter-spacing:2px;color:#888}@media(max-width:650px){.contact-header{padding:0 20px;height:80px}.brand img{height:60px}.contact-layout{grid-template-columns:1fr;gap:45px;padding:30px 24px 55px}.contact-illustration{position:static;width:85%;max-width:350px;justify-self:center}.contact-illustration h1{font-size:44px}.account-list{gap:28px}.account-avatar{width:110px;height:110px}}@media(prefers-reduced-motion:reduce){.account-link{transition:none}}
.account-avatar{display:block;position:relative;overflow:hidden;flex-shrink:0}.account-avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 36%}.avatar-crop img{position:absolute;width:128.873%;height:auto;max-width:none;left:-15.317%;top:-1.056%}
.visit-message{min-height:42px;margin:0 0 12px;text-align:center;font:italic 23px Georgia,serif;letter-spacing:.4px;white-space:pre-wrap}.visit-message span{display:inline-block;animation:message-wave 2.5s ease-in-out infinite;animation-delay:calc(var(--wave-index) * 55ms)}@keyframes message-wave{0%,45%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-9px) rotate(-2deg)}30%{transform:translateY(3px) rotate(1deg)}}@media(max-width:650px){.visit-message{font-size:18px;line-height:1.35}}@media(prefers-reduced-motion:reduce){.visit-message span{animation:none}}
</style>
<link rel="stylesheet" href="/css/daisy-footer.css">
</head><body>
<header class="contact-header"><a class="brand" href="/" aria-label="Daisy Space home"><img src="/logo.jpg" alt="Daisy Space"></a><a class="home-icon" href="/" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></a></header>
<main class="contact-layout">
<figure class="contact-illustration">
<p class="visit-message">Thanks for visiting my website：）</p>
<svg class="mail-art" viewBox="0 0 650 340" aria-hidden="true"><g fill="none" stroke="#161616" stroke-linecap="round" stroke-linejoin="round"><path d="M20 65H203 M64 96H202 M101 126L200 124 M141 154H198 M173 182H196" stroke-width="2.5"/><path d="M240 56 Q390 51 627 56 Q602 174 627 299 Q419 294 240 299 Q286 177 240 56Z" stroke-width="5"/><path d="M250 65Q343 144 427 189 M614 70Q530 131 447 188" stroke-width="4"/><path d="M299 70H572 M274 85L419 176 M607 86L462 172 M425 202Q443 220 461 201" stroke-width="2.5"/></g></svg>
<h1>Contact</h1>
</figure>
<ul class="account-list" aria-label="Daisy's accounts">
{{ range site.Data.contact }}
<li><a class="account-link" href="{{ .url }}" {{ if hasPrefix .url "https://" }}target="_blank" rel="noopener noreferrer"{{ end }} aria-label="{{ .name }} on {{ .platform }}">
<span class="account-avatar {{ if .crop }}avatar-crop{{ end }}"><img src="{{ .avatar }}" alt="{{ .name }}" width="130" height="130"></span>
<span class="account-name">
{{ if eq .icon "instagram" }}<svg class="platform-icon" aria-hidden="true" viewBox="0 0 24 24"><defs><linearGradient id="instagram-gradient" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse"><stop stop-color="#ffdc80"/><stop offset=".28" stop-color="#fcaf45"/><stop offset=".5" stop-color="#f77737"/><stop offset=".7" stop-color="#e1306c"/><stop offset=".86" stop-color="#c13584"/><stop offset="1" stop-color="#833ab4"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#instagram-gradient)"/><rect x="5.4" y="5.4" width="13.2" height="13.2" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.15" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="17.1" cy="6.95" r="1.05" fill="#fff"/></svg>
{{ else if eq .icon "linkedin" }}<svg class="platform-icon" aria-hidden="true" viewBox="0 0 24 24"><rect width="24" height="24" rx="3" fill="#0a66c2"/><path fill="#fff" d="M5 9h3v10H5zM6.5 4a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4M10 9h3v1.4c.7-1 1.6-1.6 3-1.6 3 0 3.5 2 3.5 4.5V19h-3v-5c0-1.4 0-2.6-1.5-2.6s-2 1.2-2 2.5V19h-3z"/></svg>
{{ else }}<svg class="platform-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 5 9 8 9-8"/></svg>{{ end }}
{{ .name }}</span><span class="platform-label">{{ .platform }}</span>
</a></li>
{{ end }}
</ul></main>{{ partial "daisy-footer.html" . }}
<script>(()=>{const message=document.querySelector('.visit-message');if(!message)return;const text=message.textContent;message.textContent='';[...text].forEach((character,index)=>{const span=document.createElement('span');span.textContent=character;span.style.setProperty('--wave-index',index);span.setAttribute('aria-hidden','true');message.appendChild(span)});message.setAttribute('aria-label',text)})();</script>
</body></html>
