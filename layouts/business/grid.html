<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Main Quest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;900&family=Georgia&display=swap" rel="stylesheet">

    <style>
        /* --- 1. 基础设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            color: #000;
            background-color: #000; /* 这里的背景色设为黑色，为了配合 Footer */
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- 2. 关键：覆盖式 Footer 的核心逻辑 --- */

        /* 包裹所有页面内容的白色盒子 */
        .content-wrapper {
            position: relative;
            z-index: 2; /* 层级高，盖住 Footer */
            background-color: #f4f4f4; /* 必须有背景色(白/灰)，否则盖不住 */
            margin-bottom: 400px; /* 【重点】必须等于 Footer 的高度 */
            min-height: 100vh;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); /* 加个阴影，覆盖感更强 */
            display: flex;
            flex-direction: column;
        }

        /* 被压在底下的 Footer */
        .site-footer {
            position: fixed; /* 固定在底部不动 */
            bottom: 0;
            left: 0;
            width: 100%;
            height: 400px; /* 【重点】固定高度 */
            z-index: 1; /* 层级低，在内容下面 */
            background-color: #000;
            color: #fff;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- 3. Header & Nav 样式 --- */
        .chanel-header {
            background: white;
            z-index: 100;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky; /* 导航栏吸顶 */
            top: 0;
        }
        .header-left { flex: 1; display: flex; align-items: center; }
        .brand-logo { text-decoration: none; display: flex; align-items: center; }
        .header-center { flex: 1; text-align: center; display: flex; justify-content: center; }
        .page-title { font-family: 'Georgia', serif; font-style: italic; font-size: 36px; color: #333; font-weight: normal; letter-spacing: 1px; }
        .header-right { flex: 1; display: flex; justify-content: flex-end; gap: 25px; }
        .icon-btn { position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; color: black; cursor: pointer; }
        .icon-svg { width: 24px; height: 24px; stroke-width: 1.5; transition: all 0.2s; }
        .icon-btn:hover .icon-svg { stroke: #555; transform: scale(1.1); }

        .sub-nav {
            background-color: white;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 10px 0 40px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .sub-nav a {
            text-decoration: none;
            color: #888;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 16px;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            position: relative;
            transition: color 0.3s;
        }
        .sub-nav a:hover { color: #000; }
        .sub-nav a.active { color: #000; font-weight: bold; border-bottom: 1px solid #000; }

        /* --- 4. 页面内容样式 --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        /* 介绍文字 (只有描述，无标题) */
        .intro-section {
            padding: 80px 20px 60px 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .intro-text {
            font-family: 'Georgia', serif;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
            font-style: italic;
        }

        /* Grid 列表 */
        .article-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 100px;
        }
        .article-card {
            cursor: pointer;
            transition: opacity 0.3s;
            text-decoration: none;
            color: black;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .article-card:hover { opacity: 0.9; transform: translateY(-5px); transition: transform 0.3s; }

        .img-box { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; margin-bottom: 20px; background: #ddd; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .article-card:hover .img-box img { transform: scale(1.05); }

        .card-content { padding: 0 25px 25px 25px; }
        .grid-meta { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #8B4513; margin-bottom: 10px; letter-spacing: 1px; display: flex; align-items: center; }
        .grid-line { width: 30px; height: 1px; background: #8B4513; margin-right: 10px; }
        .article-title { font-family: 'Georgia', serif; font-size: 22px; font-weight: bold; line-height: 1.3; margin-bottom: 10px; text-transform: uppercase; }
        .article-excerpt { font-size: 14px; color: #666; line-height: 1.6; }

        /* --- 5. Footer 内容样式 --- */
        .footer-logo { text-align: center; font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 60px; }
        .footer-columns { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; width: 100%; }
        .footer-col { flex: 1; padding: 0 20px; }
        .footer-col h4 { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 25px; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
        .footer-col ul { list-style: none; }
        .footer-col li { margin-bottom: 12px; }
        .footer-col a { text-decoration: none; color: #999; font-size: 13px; transition: color 0.3s; }
        .footer-col a:hover { color: #fff; }
        .footer-bottom { border-top: 1px solid #333; margin-top: 60px; padding-top: 30px; text-align: center; font-size: 11px; color: #666; }

        /* 手机适配 */
        @media (max-width: 768px) {
            /* 手机上 Footer 高度要变高，margin 也要跟着变 */
            .content-wrapper { margin-bottom: 600px; }
            .site-footer { height: 600px; }
            .footer-columns { flex-direction: column; text-align: center; gap: 40px; }
            .article-grid { grid-template-columns: 1fr; }
        }
    </style>
<link rel="stylesheet" href="/css/daisy-footer.css">
</head>
<body>

    <!-- !!! 关键结构调整：所有内容都包在 content-wrapper 里 !!! -->
    <div class="content-wrapper">

        <header class="chanel-header">
            <div class="header-left">
                <a href="/" class="brand-logo">
                     <img src="/logo.jpg" alt="Logo" style="height: 85px; width: auto;">
                </a>
            </div>
            <div class="header-center">
                <span class="page-title">Main Quest💼</span>
            </div>
            <div class="header-right">
                <a href="/contact/" class="icon-btn" data-tooltip="Contact">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="/" class="icon-btn" data-tooltip="Home">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
        </header>

        <nav class="sub-nav"><a href="/business/">Internships</a><a href="/business/education-projects/">Education&amp;Projects</a><a href="/business/volunteering/">Volunteering</a></nav>

        <div class="intro-section">
            <p class="intro-text">{{ .Description }}</p>
        </div>

        <div class="container">
            <div class="article-grid">

                {{ range .Pages }}
                <a href="{{ .RelPermalink }}" class="article-card">
                    <div class="img-box">
                        {{ if .Params.image }}
                        <img src="{{ .Params.image }}" alt="{{ .Title }}">
                        {{ else }}
                        <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?w=800&q=80">
                        {{ end }}
                    </div>
                    <div class="card-content">
                        <div class="grid-meta"><span class="grid-line"></span> READ</div>
                        <h2 class="article-title">{{ .Title }}</h2>
                        <p class="article-excerpt">{{ .Summary | truncate 80 }}</p>
                    </div>
                </a>
                {{ end }}
            </div>
        </div>

    </div> <!-- content-wrapper 结束 -->

    <!-- !!! 关键结构：Footer 放在 wrapper 外面 !!! -->
    {{ partial "daisy-footer.html" . }}

</body>
</html>
